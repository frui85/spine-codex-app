name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Require tag and source version to match
        id: version
        shell: bash
        run: |
          version="$(node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS DMGs
    needs: validate
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install package metadata
        run: npm ci --ignore-scripts
      - name: Run full checks
        run: npm run check
      - name: Build Apple Silicon and Intel DMGs
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/build-macos-release.mjs --all --version "$RELEASE_VERSION"
      - name: Verify DMGs and checksums
        shell: bash
        run: |
          set -euo pipefail
          for image in dist/*.dmg; do
            hdiutil verify "$image"
          done
          (cd dist && shasum -a 256 -c ./*.sha256)
          test "$(find dist -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')" = "2"
          test "$(find dist -maxdepth 1 -name '*.sha256' | wc -l | tr -d ' ')" = "2"
      - name: Verify no upstream application is bundled
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .build/macos-*/dmg -type f \( -name 'ChatGPT' -o -name 'Codex' -o -name 'spine-codex.cmd' \) -print)"
          test -z "$(find .build/macos-*/dmg -type f -size +20M ! -path '*/runtime/node' -print)"
      - name: Upload verified macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ needs.validate.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Download verified assets
        uses: actions/download-artifact@v4
        with:
          name: macos-release-${{ needs.validate.outputs.version }}
          path: dist
      - name: Verify downloaded checksums
        run: (cd dist && sha256sum -c ./*.sha256)
      - name: Create or update release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes_source="docs/RELEASE_NOTES_v${VERSION}.md"
          notes="$RUNNER_TEMP/release-notes-v${VERSION}.md"
          test -f "$notes_source"
          node scripts/prepare-release-notes.mjs \
            "$notes_source" "$notes" "$GITHUB_REPOSITORY" "$TAG" "$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft \
              --title "SpineCodex App $TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.sha256 --clobber
          gh release edit "$TAG" --title "SpineCodex App $TAG" \
            --notes-file "$notes" --draft=false --latest
